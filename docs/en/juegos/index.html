<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Change page title -->
  <title>Games - Tori</title>

  <!-- Description for search engines -->
  <meta name="description" content="Tori.">

  <!-- Keywords (not very important nowadays, but useful for SEO) -->
  <meta name="keywords" content="Tori, game development, horror game, YouTube, video games, indie games, C++, Unreal Engine, Unity">

  <!-- Add favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Language -->
<script>
  const lang = localStorage.getItem('lang') || 'es';

  function redirectToLanguagePage(lang) {
   const pathParts = window.location.pathname.split('/').filter(Boolean);
	  const isEnglish = pathParts[0] === 'en';
	  const baseName = isEnglish ? pathParts[1] || 'index' : pathParts[0] || 'index';

	  let newPath;
		if (baseName === 'index') {
		  newPath = lang === 'en' ? `/en/` : `/`;
		} else {
		  newPath = lang === 'en' ? `/en/${baseName}/` : `/${baseName}/`;
		}


  // Redirige solo si es diferente
  if (window.location.pathname !== newPath) {
    window.location.href = newPath;
  }
}

  redirectToLanguagePage(lang);
</script>
</head>
<body>
  <header>
  <!-- Hamburger button only on mobile -->
  <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>

  <button class="btn-inicio desktop-only" onclick="window.location.href='/'">
    <strong>TORI</strong>
    <img src="/images/icon.webp" alt="Icon" class="icono-boton">
  </button>

  <nav id="menu-nav">
    <button class="btn-inicio mobile-only" onclick="window.location.href='/'">
      <strong>TORI</strong>
      <img src="/images/icon.webp" alt="Icon" class="icono-boton">
    </button>

    <a href="/en/juegos/">Games</a>
    <a href="/en/youtube/">YouTube</a>
    <a href="/en/sobre-mi/">About Me</a>
    <a href="/en/contacto/">Contact</a>
    <a href="/en/galeria/">Gallery</a>

    <!-- Language selector -->
    <select id="language-selector-mobile" onchange="changeLanguage(this.value)">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
  </nav>

  <select id="language-selector" onchange="changeLanguage(this.value)">
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>

  <script>
    function changeLanguage(lang) {
	  localStorage.setItem('lang', lang);

	  const pathParts = window.location.pathname.split('/').filter(Boolean);
	  const isEnglish = pathParts[0] === 'en';
	  const baseName = isEnglish ? pathParts[1] || 'index' : pathParts[0] || 'index';

	    let newPath;
		if (baseName === 'index') {
		  newPath = lang === 'en' ? `/en/` : `/`;
		} else {
		  newPath = lang === 'en' ? `/en/${baseName}/` : `/${baseName}/`;
		}

	  window.location.href = newPath;
	}

    // On load, select the saved language
    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('lang') || 'en';
      document.getElementById('language-selector').value = savedLang;
	  document.getElementById('language-selector-mobile').value = savedLang;
    });

    // Function to show/hide menu
    function toggleMenu() {
      const nav = document.querySelector('nav');
      nav.classList.toggle('show');
    }
  </script>
</header>

  <main class="page-content">
    <h1>My Games</h1>
    <div class="games-grid">
      <!-- Game 1 -->
      <a class="game-card" href="/en/theplantshop/">
      <img src="/images/juego2.webp" alt="Game 2">
    </a>
      <a class="game-card" href="/en/deerhead/">
        <img src="/images/juego1.webp" alt="Game 1">
      </a>
    </div>
  </main>

  <footer style="background-color: #222; color: white; padding: 20px 0; text-align: center;">
    <div style="margin-bottom: 10px;"></div>
    <div style="display: flex; justify-content: center; gap: 25px; flex-wrap: wrap;">

      <a href="https://www.youtube.com/@ToriGameDev" target="_blank" style="color: white; font-size: 2rem;">
        <i class="fab fa-youtube"></i>
      </a>

      <a href="https://www.twitch.tv/ToriDev" target="_blank" style="color: white; font-size: 2rem;">
        <i class="fab fa-twitch"></i>
      </a>

      <a href="https://www.instagram.com/ToriGameDev" target="_blank" style="color: white; font-size: 2rem;">
        <i class="fab fa-instagram"></i>
      </a>

      <a href="https://www.tiktok.com/@ToriGameDev" target="_blank" style="color: white; font-size: 2rem;">
        <i class="fab fa-tiktok"></i>
      </a>

      <a href="https://twitter.com/ToriGameDev" target="_blank" style="color: white; font-size: 2rem;">
        <i class="fab fa-x-twitter"></i>
      </a>

    </div>
    <p>© 2025 Tori</p>
  </footer>
</body>
</html>

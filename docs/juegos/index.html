<!DOCTYPE html>

  <!-- Palabras clave (no tan importantes hoy en día, pero útil para SEO) -->

  <!-- Añadir favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Idioma -->
	<script>
  const lang = localStorage.getItem('lang') || 'es';

  function redirectToLanguagePage(lang) {
   const pathParts = window.location.pathname.split('/').filter(Boolean);
	  const isEnglish = pathParts[0] === 'en';
	  const baseName = isEnglish ? pathParts[1] || 'index' : pathParts[0] || 'index';

	  let newPath;
		if (baseName === 'index') {
		  newPath = lang === 'en' ? `/en/` : `/`;
		} else {
		  newPath = lang === 'en' ? `/en/${baseName}/` : `/${baseName}/`;
		}


  // Redirige solo si es diferente
  if (window.location.pathname !== newPath) {
    window.location.href = newPath;
  }
}

  redirectToLanguagePage(lang);
</script>
</head>
<body>
  <header>
  <!-- Botón hamburguesa solo en móviles -->
  <button class="menu-toggle" onclick="toggleMenu()">☰ Menú</button>

 <!-- Botón inicio para escritorio -->
  <button class="btn-inicio desktop-only" onclick="window.location.href='/'">
    <strong>TORI</strong>
    <img src="/images/icon.webp" alt="Icono" class="icono-boton">
  </button>

  <!-- Menú desplegable o navbar -->
  <nav id="menu-nav">
    <!-- Botón inicio (solo visible en móviles) -->
    <button class="btn-inicio mobile-only" onclick="window.location.href='/'">
      <strong>TORI</strong>
      <img src="/images/icon.webp" alt="Icono" class="icono-boton">
    </button>

    <a href="/juegos/">Juegos</a>

    <a href="/sobre-mi/">Sobre mí</a>
    <a href="/contacto/">Contacto</a>
    <a href="/galeria/">Galería</a>

    <!-- Selector de idioma -->
    <select id="language-selector-mobile" onchange="changeLanguage(this.value)">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
  </nav>

   <select id="language-selector" onchange="changeLanguage(this.value)">
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>

  <script>
    function changeLanguage(lang) {
	  localStorage.setItem('lang', lang);

	  const pathParts = window.location.pathname.split('/').filter(Boolean);
	  const isEnglish = pathParts[0] === 'en';
	  const baseName = isEnglish ? pathParts[1] || 'index' : pathParts[0] || 'index';

	  let newPath;
		if (baseName === 'index') {
		  newPath = lang === 'en' ? `/en/` : `/`;
		} else {
		  newPath = lang === 'en' ? `/en/${baseName}/` : `/${baseName}/`;
		}

	  window.location.href = newPath;
	}

    // Al cargar, selecciona el idioma guardado
    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('lang') || 'es';
      document.getElementById('language-selector').value = savedLang;
	  document.getElementById('language-selector-mobile').value = savedLang;
    });

    // Función para mostrar/ocultar el menú
    function toggleMenu() {
      const nav = document.querySelector('nav');
      nav.classList.toggle('show');
    }
  </script>
</header>
